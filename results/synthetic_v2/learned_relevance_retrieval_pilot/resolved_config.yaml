project:
  name: relevance-support-replay
agent:
  algorithm: ddqn
  gamma: 0.99
  learning_rate: 0.0003
  batch_size: 64
  target_update_steps: 1000
  hidden_sizes:
  - 128
  - 128
  grad_clip_norm: 10.0
replay:
  type: uniform
  capacity: 50000
experiment:
  episodes: 300
  learning_starts: 1000
  train_frequency: 4
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 20000
  eval_episodes: 30
  seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.1
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0
contexts:
  A:
    rotation_deg: 0.0
  B:
    rotation_deg: 90.0
  D:
    rotation_deg: 180.0
representation:
  seed: 1
  history_length: 8
  collection_steps_per_episode: 80
  train_episodes_per_context: 60
  val_episodes_per_context: 15
  test_episodes_per_context: 15
  novel_D_episodes: 15
  sample_stride: 2
  gru_hidden_dim: 32
  latent_dim: 16
  predictor_hidden_dim: 64
  batch_size: 256
  max_epochs: 50
  patience: 6
  learning_rate: 0.001
  weight_decay: 1.0e-05
retrieval:
  seed: 1
  A1_steps: 20000
  B_steps: 20000
  A2_steps: 2000
  replay_capacity: 100000
  recent_window: 5000
  bank_stride: 4
  query_stride: 4
  max_bank_windows_per_context: 4000
  top_k_primary: 10
  top_k_secondary: 50
  early_query_max_step: 512
criteria:
  min_early_precision_at_10: 0.9
  min_first2k_precision_at_10: 0.9
