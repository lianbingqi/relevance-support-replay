project:
  name: relevance-support-replay
agent:
  algorithm: ddqn
  gamma: 0.99
  learning_rate: 0.0003
  batch_size: 64
  target_update_steps: 1000
  hidden_sizes:
  - 128
  - 128
  grad_clip_norm: 10.0
replay:
  type: uniform
  capacity: 50000
experiment:
  episodes: 300
  learning_starts: 1000
  train_frequency: 4
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 20000
  eval_episodes: 30
  seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
environment:
  family: synthetic
  schedule: stationary
  context_name: A
  max_episode_steps: 200
  noise_std: 0.01
  init_x_range: 1.25
  init_v_range: 0.1
  x_limit: 4.0
  v_limit: 3.0
contexts:
  A:
    rho: 0.85
    beta: 0.18
