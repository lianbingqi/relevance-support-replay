reference_context: A

calibration:
  train_seeds: [1, 2, 3]
  training_episodes: 300
  eval_episodes_per_policy: 30
  random_baseline_episodes: 100

environment:
  max_episode_steps: 200
  noise_std: 0.01
  init_x_range: 1.25
  init_v_range: 0.10
  x_limit: 4.0
  v_limit: 3.0

contexts:
  A: {rho: 0.85, beta: 0.18}
  C1_low_rho: {rho: 0.70, beta: 0.18}
  C2_high_rho: {rho: 0.95, beta: 0.18}
  C3_low_beta: {rho: 0.85, beta: 0.10}
  C4_high_beta: {rho: 0.85, beta: 0.28}
  C5_low_rho_low_beta: {rho: 0.70, beta: 0.10}
  C6_low_rho_high_beta: {rho: 0.70, beta: 0.28}
  C7_high_rho_low_beta: {rho: 0.95, beta: 0.10}
  C8_high_rho_high_beta: {rho: 0.95, beta: 0.28}
