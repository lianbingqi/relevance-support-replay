environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.10
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0

contexts:
  A: {rotation_deg: 0.0}
  B: {rotation_deg: 90.0}
  D: {rotation_deg: 180.0}

recurrence:
  phases:
    - {name: A1, context: A, steps: 20000}
    - {name: B,  context: B, steps: 20000}
    - {name: A2, context: A, steps: 10000}

  methods: [uniform, recent, oracle]
  seeds: [1]
  max_workers: 2

  replay_capacity: 100000
  recent_window: 5000
  oracle_historical_fraction: 0.80

  eval_interval_steps: 2000
  eval_episodes: 5
  random_baseline_episodes: 50

  a1_reference_checkpoints: 3
  recovery_threshold: 0.90
  recovery_consecutive_checkpoints: 2
  early_a2_window_steps: 6000

pilot_screen:
  min_recovery_improvement_steps: 2000
  min_early_a2_score_advantage: 0.10
