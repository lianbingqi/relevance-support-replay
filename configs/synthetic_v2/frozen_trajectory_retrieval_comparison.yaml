  max_bank_windows_per_context: 4000
  top_k_primary: 10
  top_k_secondary: 50
  early_query_max_step: 512
  encoder_05b_config: configs/synthetic_v2/dynamics_isolated_retrieval_pilot.yaml
  encoder_05c_config: configs/synthetic_v2/behavior_diverse_retrieval_pilot.yaml

criteria:
  min_early_precision_at_10: 0.90
  min_first2k_precision_at_10: 0.90
