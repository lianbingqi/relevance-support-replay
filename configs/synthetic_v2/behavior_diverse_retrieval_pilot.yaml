environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.10
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0

contexts:
  A: {rotation_deg: 0.0}
  B: {rotation_deg: 90.0}
  D: {rotation_deg: 180.0}

representation:
  seed: 1

  history_length: 8
  collection_steps_per_episode: 80
  train_episodes_per_context: 60
  val_episodes_per_context: 15
  test_episodes_per_context: 15
  sample_stride: 2

  gru_hidden_dim: 32
  latent_dim: 16
  predictor_hidden_dim: 64

  batch_size: 256
  max_epochs: 50
  patience: 6
  learning_rate: 0.001
  weight_decay: 0.00001

behavior_diverse:
  policy_train_steps: 20000

  policy_A_seed: 11
  policy_B_seed: 12

  ddqn_train_episodes_per_behavior_context: 30
  ddqn_val_episodes_per_behavior_context: 10
  ddqn_test_episodes_per_behavior_context: 10

  rollout_steps_per_episode: 80

retrieval:
  seed: 1

  A1_steps: 20000
  B_steps: 20000
  A2_steps: 2000

  replay_capacity: 100000
  recent_window: 5000

  bank_stride: 4
  query_stride: 4
  max_bank_windows_per_context: 4000

  top_k_primary: 10
  top_k_secondary: 50

  early_query_max_step: 512

criteria:
  min_early_precision_at_10: 0.90
  min_first2k_precision_at_10: 0.90
