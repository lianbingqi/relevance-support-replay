environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.10
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0
contexts:
  A: {rotation_deg: 0.0}
  B: {rotation_deg: 90.0}
  D: {rotation_deg: 180.0}
representation:
  seed: 1
  history_length: 8
  collection_steps_per_episode: 80
  train_episodes_per_context: 60
  val_episodes_per_context: 15
  test_episodes_per_context: 15
  novel_D_episodes: 15
  sample_stride: 2
  gru_hidden_dim: 32
  latent_dim: 16
  predictor_hidden_dim: 64
  batch_size: 256
  max_epochs: 50
  patience: 6
  learning_rate: 0.001
  weight_decay: 0.00001
  retrieval_k: 10
  max_retrieval_bank: 5000
criteria:
  min_relative_mse_improvement: 0.20
  min_centroid_accuracy: 0.90
  min_retrieval_precision_at_k: 0.90
