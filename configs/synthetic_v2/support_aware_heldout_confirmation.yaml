environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.10
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0

contexts:
  A: {rotation_deg: 0.0}
  B: {rotation_deg: 90.0}
  D: {rotation_deg: 180.0}

representation:
  seed: 1
  history_length: 8
  collection_steps_per_episode: 80
  train_episodes_per_context: 60
  val_episodes_per_context: 15
  test_episodes_per_context: 15
  sample_stride: 2
  gru_hidden_dim: 32
  latent_dim: 16
  predictor_hidden_dim: 64
  batch_size: 256
  max_epochs: 50
  patience: 6
  learning_rate: 0.001
  weight_decay: 0.00001

behavior_diverse:
  policy_train_steps: 20000
  policy_A_seed: 11
  policy_B_seed: 12
  ddqn_train_episodes_per_behavior_context: 30
  ddqn_val_episodes_per_behavior_context: 10
  ddqn_test_episodes_per_behavior_context: 10
  rollout_steps_per_episode: 80

# Kept identical to the frozen RQ2 recurrence protocol so the existing
# evaluate/random-A/control implementations can be reused exactly.
isolation:
  seed: 1
  A1_steps: 20000
  B_steps: 20000
  A2_steps: 10000
  replay_capacity: 100000
  recent_window: 5000
  oracle_historical_fraction: 0.80
  learned_historical_fraction: 0.80
  history_bank_stride: 4
  max_history_bank_windows: 8000
  learned_retrieval_top_k_windows: 50
  eval_episodes: 5
  A1_reference_steps: [16000, 18000, 20000]
  A2_eval_steps:
    [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000,
     1250, 1500, 1750, 2000, 3000, 4000, 6000, 8000, 10000]
  recovery_threshold: 0.90
  recovery_consecutive_checkpoints: 2
  auc_window_steps: 2000
  random_baseline_episodes: 50

# Kept identical to the seed-1 novelty pilot except seed is supplied by
# the held-out loop.
novelty:
  seed: 1
  A1_steps: 20000
  B_steps: 20000
  D_steps: 10000
  replay_capacity: 100000
  recent_window: 5000
  learned_historical_fraction: 0.80
  history_bank_stride: 4
  max_history_bank_windows: 8000
  learned_retrieval_top_k_windows: 50
  eval_episodes: 5
  D_reference_steps: 20000
  D_reference_eval_steps: [16000, 18000, 20000]
  D_eval_steps:
    [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000,
     1250, 1500, 1750, 2000, 3000, 4000, 6000, 8000, 10000]
  recovery_threshold: 0.90
  recovery_consecutive_checkpoints: 2
  auc_window_steps: 2000
  random_baseline_episodes: 50

confirmation:
  heldout_seeds: [2, 3]

  selected_support_score: retrieved_mean_mse
  support_calibration_quantile: 0.95
  ood_calibration_quantile: 0.95
  score_eps: 1.0e-6

  # Formal claim criteria.
  auc_tolerance: 0.10
  min_ABA_support_acceptance: 0.70
  max_ABD_support_acceptance: 0.30

  require_exact_RQ2_ABA_control_reproduction: false
  record_RQ2_ABA_control_drift: true
  fork_identity_atol: 1.0e-10
