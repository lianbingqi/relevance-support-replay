# E1d v2.16: E1 A1->B on-policy Q and frozen-05c latent ablation.
# Copy of frozen E1 config settings, plus E1c recording-only fields.
# E1 exploratory factorial, NOT formal confirmation. Seeds 4/5/6 untouched.
environment:
  rho: 0.85
  beta: 0.12
  noise_std: 0.01
  init_position_range: 1.0
  init_velocity_range: 0.1
  max_episode_steps: 200
  safety_radius: 25.0
  safety_speed: 10.0
contexts:
